# Hotel El Recuerdo: base de datos, migraciones, API y sitio web.
# Lee las variables del archivo .env de esta carpeta (ver .env.example).
#
#   docker compose up -d --build            # todo el sistema en http://localhost:8080
#   docker compose up -d db                 # solo PostgreSQL (desarrollo con npm run dev)
#   docker compose run --rm migraciones     # aplicar migraciones pendientes
#   docker compose run --rm migraciones npm run crear-admin   # primer usuario administrador
#
# Producción: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d (ver README).
name: hotel-el-recuerdo

# Rol dueño de las tablas (solo para migraciones) y rol de la API con permisos mínimos
x-url-dueno: &url-dueno postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hotel_el_recuerdo}
x-url-app: &url-app postgresql://${APP_DB_USER:-hotel_app}:${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en .env}@db:5432/${POSTGRES_DB:-hotel_el_recuerdo}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-hotel_el_recuerdo}
    # Solo accesible desde este equipo (no se expone a la red local)
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5436}:5432'
    volumes:
      - hotel_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/01-bd-pruebas.sh:/docker-entrypoint-initdb.d/01-bd-pruebas.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

  # Paso de release: aplica las migraciones pendientes y termina. La API espera a que acabe bien.
  migraciones:
    build:
      context: ./backend
      target: migraciones
    environment:
      NODE_ENV: production
      # Migra con el rol dueño; crea el rol de la API y carga los datos base con ese rol
      MIGRATION_DATABASE_URL: *url-dueno
      DATABASE_URL: *url-app
      # El seed carga la misma configuración validada que la API
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      # Rol sin permisos para cambiar tablas ni tocar la auditoría (scripts/rol-aplicacion.ts)
      DATABASE_URL: *url-app
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_TTL_MIN: ${JWT_TTL_MIN:-120}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
      migraciones:
        condition: service_completed_successfully
    # Sin puertos publicados: solo el contenedor web la alcanza por la red interna de Compose

  web:
    build:
      context: ./frontend
      args:
        # URL pública del sitio (enlace canónico e imagen para redes sociales)
        SITIO_URL: ${SITIO_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'

volumes:
  hotel_pgdata:
