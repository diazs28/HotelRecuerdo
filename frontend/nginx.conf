# Sitio web de Hotel El Recuerdo: sirve el frontend compilado y reenvía /api a la API interna.
# Corre como usuario no privilegiado (imagen nginx-unprivileged) en el puerto 8080.

server_tokens off;

# La IP real del visitante llega a la API en X-Forwarded-For (TRUST_PROXY=1 en la API).
# Si hay otro proxy delante (Caddy en producción), se confía en la red interna de Docker.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 200k;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Cabeceras de seguridad para todo el sitio (la API añade las suyas con helmet)
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Archivos con hash en el nombre: caché larga
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Aplicación de una sola página: cualquier otra ruta sirve index.html (sin caché)
  location / {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }
}
