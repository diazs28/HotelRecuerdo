# Sitio web de Hotel El Recuerdo: sirve el frontend compilado y reenvía /api a la API interna.
# Corre como usuario no privilegiado (imagen nginx-unprivileged) en el puerto 8080.

server_tokens off;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 200k;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # La API recibe la cadena X-Forwarded-For con la IP que ve nginx agregada al final. La API solo
  # confía en los últimos TRUST_PROXY saltos (1 = nginx; 2 en producción = Caddy + nginx), así que
  # una cabecera falsificada por el visitante no cambia la IP que usan los límites de intentos.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Archivos con hash en el nombre: caché larga
  location /assets/ {
    include /etc/nginx/snippets/cabeceras-seguridad.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Panel del personal: no se indexa en buscadores
  location /panel {
    include /etc/nginx/snippets/cabeceras-seguridad.conf;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow" always;
    # rewrite ... break sirve index.html sin salir de este location (conserva sus cabeceras)
    rewrite ^ /index.html break;
  }

  # Aplicación de una sola página: cualquier otra ruta sirve index.html (sin caché)
  location / {
    include /etc/nginx/snippets/cabeceras-seguridad.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }
}
