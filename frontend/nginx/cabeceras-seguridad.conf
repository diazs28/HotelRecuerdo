# Cabeceras de seguridad del sitio. Se incluyen en cada location que sirve archivos del frontend
# (en nginx, un add_header dentro de un location anula los heredados del server).
# Las respuestas de /api llevan las cabeceras de la API (helmet), sin duplicarlas aquí.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;
