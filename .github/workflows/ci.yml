# CI de Hotel El Recuerdo: backend (con PostgreSQL efímero) y frontend.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        # Base efímera SOLO para las pruebas de CI (no son credenciales reales)
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: hotel_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d hotel_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/hotel_test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/hotel_ci_no_usada
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate && npx prisma validate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: npm audit (alto o crítico falla)
        run: npm audit --audit-level=high --omit=dev

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: npm audit (alto o crítico falla)
        run: npm audit --audit-level=high --omit=dev

  imagenes:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runtime -t hotel-api backend
      - run: docker build --target migraciones -t hotel-migraciones backend
      - run: docker build -t hotel-web frontend

  secretos:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks sobre todo el historial
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --redact --verbose
